<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Kuba Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .notification-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:18px 0; }
    .notification-grid > div { padding:12px; border:1px solid var(--border,#e5e7eb); border-radius:10px; background:var(--card,#fff); }
    .notification-grid span, .notification-message > span { display:block; font-size:12px; color:var(--muted,#64748b); margin-bottom:4px; }
    .notification-grid strong { display:block; font-size:14px; overflow-wrap:anywhere; }
    .notification-message { margin:12px 0 16px; padding:12px 14px; border-left:3px solid var(--primary,#6d5dfc); background:var(--soft,#f8f7ff); border-radius:8px; }
    .notification-message p { margin:4px 0 0; white-space:pre-wrap; }
    .notification-card { margin-bottom:16px; }
    @media (max-width:800px) { .notification-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:520px) { .notification-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<nav class="navbar">
  <button id="menu-btn"><i class="fas fa-bars"></i></button>
  <a href="plataforma.html" class="navbar-brand"><div class="brand-icon"><i class="fas fa-tools"></i></div>Kuba Tech</a>
</nav>
<div id="wrapper">
  <aside id="sidebar">
    <span class="sidebar-label">Administração da Plataforma</span>
    <a href="plataforma.html" class="nav-item"><i class="fas fa-building"></i> Empresas</a>
    <a href="notificacoes.html" class="nav-item active"><i class="fas fa-bell"></i> Notificações</a>
  </aside>
  <main id="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Notificações</h1>
        <p class="page-sub" id="sub-count">Carregando...</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="f" style="max-width:280px;">
        <label class="sr-only" for="filtro-solic">Filtrar por situação</label>
        <select id="filtro-solic">
          <option value="">Todas as solicitações</option>
          <option value="pending">Aguardando análise</option>
          <option value="in_service">Em atendimento</option>
          <option value="done">Concluídas</option>
          <option value="rejected">Recusadas</option>
        </select>
      </div>
    </div>
    <div id="notificacoes" class="pay-cards"></div>
  </main>
</div>
<script src="../js/config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/notificacoes.js"></script>
</body>
</html>
