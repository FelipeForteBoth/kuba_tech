<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma — Kuba Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <button id="menu-btn"><i class="fas fa-bars"></i></button>
  <a href="plataforma.html" class="navbar-brand">
    <div class="brand-icon"><i class="fas fa-tools"></i></div>
    Kuba Tech
  </a>
</nav>

<div id="wrapper">
  <aside id="sidebar">
    <span class="sidebar-label">Administração da Plataforma</span>
    <a href="plataforma.html" class="nav-item" data-page="plataforma"><i class="fas fa-building"></i> Empresas</a>
  </aside>

  <main id="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Painel da Plataforma</h1>
        <p class="page-sub" id="sub-count">Carregando...</p>
      </div>
      <button class="btn btn-primary" id="btn-new"><i class="fas fa-plus"></i> Nova Empresa</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon ico-purple"><i class="fas fa-building"></i></div>
        <div><div class="stat-val" id="s-empresas">—</div><div class="stat-lbl">Empresas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon ico-green"><i class="fas fa-circle-check"></i></div>
        <div><div class="stat-val" id="s-ativas">—</div><div class="stat-lbl">Assinaturas ativas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon ico-yellow"><i class="fas fa-circle-pause"></i></div>
        <div><div class="stat-val" id="s-suspensas">—</div><div class="stat-lbl">Assinaturas suspensas</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon ico-red"><i class="fas fa-sack-dollar"></i></div>
        <div><div class="stat-val" id="s-receita">—</div><div class="stat-lbl">Receita mensal</div></div>
      </div>
    </div>

    <div class="page-header"><div><h2 class="page-title" style="font-size:18px;">Planos disponíveis</h2></div></div>
    <div class="stat-grid" id="planos"></div>

    <h2 class="section-title" id="tit-solic">Solicitações de pagamento</h2>
    <div class="toolbar">
      <div class="f" style="max-width:280px;">
        <label class="sr-only" for="filtro-solic">Filtrar por situação</label>
        <select id="filtro-solic">
          <option value="">Todas as situações</option>
          <option value="sent">Solicitação enviada</option>
          <option value="in_service">Em atendimento</option>
          <option value="info_sent">Informações enviadas</option>
          <option value="awaiting_confirmation">Aguardando confirmação</option>
          <option value="confirmed">Pagamento confirmado</option>
          <option value="canceled">Cancelada</option>
        </select>
      </div>
    </div>
    <div class="pay-cards" id="solicitacoes"></div>

    <div class="toolbar">
      <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input type="text" class="search-input" id="search-input" placeholder="Buscar por razão social, CNPJ ou e-mail...">
      </div>
      <button class="btn-sort" id="btn-sort"><i class="fas fa-sort-alpha-down"></i> A–Z</button>
    </div>

    <div class="tcard">
      <div class="tscroll">
        <table>
          <thead>
            <tr><th>Empresa</th><th>CNPJ</th><th>Plano</th><th>Usuários</th><th>O.S.</th><th>Assinatura</th><th></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div id="overlay" class="overlay"></div>
<div id="drawer" class="drawer">
  <div class="drawer-hd">
    <div>
      <div class="drawer-title" id="drawer-title">Empresa</div>
      <div class="drawer-mode" id="drawer-mode">Visualização</div>
    </div>
    <button class="drawer-x" id="drawer-x">×</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-ft" id="drawer-ft"></div>
</div>

<script src="../js/config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/plataforma.js"></script>
</body>
</html>
