<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar empresa — Kuba Tech</title>
    <link rel="stylesheet" href="../css/login.css">
  </head>
  <body>
    <div class="login-container">
      <h1>Cadastrar empresa</h1>

      <input type="text" id="companyName" placeholder="Razão social" />
      <input type="text" id="document" data-mask="cnpj" placeholder="CNPJ" />
      <input type="email" id="companyEmail" placeholder="E-mail da empresa" />
      <input type="text" id="phone" data-mask="phone" placeholder="Telefone (opcional)" />

      <input type="text" id="adminName" placeholder="Nome do administrador" />
      <input type="email" id="adminEmail" placeholder="E-mail do administrador" />
      <input type="password" id="password" placeholder="Senha (mín. 8 caracteres, letras e números)" />

      <button onclick="cadastrarEmpresa()">Criar conta</button>

      <p id="mensagem"></p>
      <p style="margin-top:14px;font-size:14px;">
        Já tem conta? <a href="login.html">Entrar</a>
      </p>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/cadastro.js"></script>
  </body>
</html>
