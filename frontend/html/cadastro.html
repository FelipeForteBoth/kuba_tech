<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar empresa — Kuba Tech</title>
    <meta name="description" content="Cadastre sua empresa no Kuba Tech informando o CNPJ: os dados públicos são preenchidos automaticamente." />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Ir para o conteúdo</a>

    <header class="au-nav">
      <a href="../index.html" class="au-brand">
        <span class="au-brand-icon" aria-hidden="true"><i class="fas fa-tools"></i></span>
        Kuba Tech
      </a>
      <a href="login.html" class="au-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Já tenho conta</a>
    </header>

    <main class="au-main" id="main-content">
      <div class="au-card wide">
        <h1 class="au-title">Cadastrar empresa</h1>
        <p class="au-sub">Informe o CNPJ e buscamos automaticamente os dados públicos da sua empresa. Depois é só revisar.</p>

        <form id="form-cadastro" novalidate>
          <p class="au-legend">Dados da empresa</p>

          <div class="au-field">
            <label for="document">CNPJ</label>
            <input type="text" id="document" data-mask="cnpj" inputmode="numeric"
                   placeholder="00.000.000/0000-00" autocomplete="organization-tax-id" required />
          </div>

          <div class="au-field">
            <label for="companyName">Razão social</label>
            <input type="text" id="companyName" placeholder="Razão social da empresa"
                   autocomplete="organization" required />
          </div>

          <div class="au-grid cols-2">
            <div class="au-field">
              <label for="companyEmail">E-mail da empresa</label>
              <input type="email" id="companyEmail" placeholder="contato@empresa.com.br"
                     inputmode="email" autocomplete="email" required />
            </div>
            <div class="au-field">
              <label for="phone">Telefone (opcional)</label>
              <input type="text" id="phone" data-mask="phone" inputmode="tel"
                     placeholder="(00) 00000-0000" autocomplete="tel" />
            </div>
          </div>

          <div class="au-grid cols-2">
            <div class="au-field">
              <label for="zipCode">CEP</label>
              <input type="text" id="zipCode" data-mask="cep" inputmode="numeric" placeholder="00000-000" />
            </div>
            <div class="au-field">
              <label for="address">Endereço</label>
              <input type="text" id="address" placeholder="Rua, número" autocomplete="street-address" />
            </div>
          </div>

          <div class="au-grid cols-2">
            <div class="au-field">
              <label for="neighborhood">Bairro</label>
              <input type="text" id="neighborhood" placeholder="Bairro" />
            </div>
            <div class="au-field">
              <label for="city">Cidade</label>
              <input type="text" id="city" placeholder="Cidade" />
            </div>
          </div>

          <div class="au-field">
            <label for="state">Estado (UF)</label>
            <input type="text" id="state" maxlength="2" placeholder="UF" />
          </div>



          <p class="au-legend">Administrador da conta</p>

          <div class="au-field">
            <label for="adminName">Nome completo</label>
            <input type="text" id="adminName" placeholder="Nome e sobrenome" autocomplete="name" required />
          </div>

          <div class="au-field">
            <label for="adminEmail">E-mail de acesso</label>
            <input type="email" id="adminEmail" placeholder="voce@empresa.com.br"
                   inputmode="email" autocomplete="email" required />
          </div>

          <div class="au-field">
            <label for="password">Senha</label>
            <div class="au-pass">
              <input type="password" id="password" placeholder="Mínimo 8 caracteres, com letras e números"
                     autocomplete="new-password" required />
              <button type="button" class="au-eye" id="btn-eye"
                      aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="au-btn" id="btn-criar">
            <i class="fas fa-building-circle-check" aria-hidden="true"></i> Criar conta
          </button>
        </form>

        <p class="au-msg" id="mensagem" role="status" aria-live="polite"></p>

        <p class="au-foot">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </main>

    <div class="au-overlay" id="overlay-auth" role="alert" aria-live="assertive" aria-hidden="true">
      <div class="au-overlay-box">
        <div class="au-spinner" aria-hidden="true"></div>
        <p class="au-overlay-txt">Criando sua conta...</p>
        <p class="au-overlay-sub">Estamos preparando o ambiente da sua empresa.</p>
      </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/cadastro.js"></script>
  </body>
</html>
